:root{
  --cream:#F8F5EF; --white:#FFFFFF; --off:#F1F1F1;
  --lav1:#E3C5F9; --lav2:#CDDBFA; --vanilla:#FFF1C8; --peach:#E5CCBE; --pink:#FFE4D7; --sky:#97BDF3;
  --plum:#65516F; --ink:#2C2D34; --muted:#7B7482; --line:#E6E0EA;
  --violet:#9B2CFF; --violet2:#C400FF;
  --night1:#1E1726; --night2:#33263F; --nightline:rgba(227,197,249,.18);
  --loss:#FF6B8B; --gain:#97BDF3;
  --f-head:"Cormorant Garamond", Georgia, serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Montserrat", system-ui, sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;transition:background .8s ease,color .8s ease;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 85% 10%,rgba(227,197,249,.75),transparent 70%),
             radial-gradient(45% 40% at 5% 95%,rgba(205,219,250,.8),transparent 70%),
             radial-gradient(30% 30% at 10% 20%,rgba(255,228,215,.7),transparent 70%);
  transition:opacity .8s ease}
body.dark{background:var(--night1);color:#F4ECFA}
body.dark::before{background:radial-gradient(45% 35% at 80% 0%,rgba(155,44,255,.28),transparent 70%),
             radial-gradient(50% 40% at 0% 100%,rgba(151,189,243,.18),transparent 70%),
             linear-gradient(180deg,var(--night1),var(--night2))}
body.dark.pulse::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  box-shadow:inset 0 0 120px 30px rgba(255,107,139,.0);animation:beat 1.1s infinite}
@keyframes beat{0%,100%{box-shadow:inset 0 0 90px 10px rgba(255,107,139,.05)}12%{box-shadow:inset 0 0 140px 40px rgba(255,107,139,.35)}24%{box-shadow:inset 0 0 90px 10px rgba(255,107,139,.08)}36%{box-shadow:inset 0 0 130px 30px rgba(255,107,139,.28)}}
body.flash-loss::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;background:rgba(255,107,139,.22);animation:fade .7s forwards}
body.flash-gain::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;background:rgba(151,189,243,.22);animation:fade .7s forwards}
@keyframes fade{to{opacity:0}}

.wrap{max-width:540px;margin:0 auto;min-height:100%;padding:18px 20px 40px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--plum);font-weight:500}
body.dark .brand{color:rgba(244,236,250,.7)}
.brand img{width:22px;height:22px}
.top .sp{flex:1}
.snd{border:1px solid var(--line);background:transparent;color:inherit;border-radius:99px;font:500 11px var(--f-body);padding:6px 10px;cursor:pointer}
body.dark .snd{border-color:var(--nightline)}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.trust{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.65);border:1px solid var(--line)}
body.dark .trust{background:rgba(255,255,255,.05);border-color:var(--nightline);box-shadow:0 0 30px rgba(155,44,255,.15)}
.trust .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
body.dark .trust .lbl{color:rgba(244,236,250,.6)}
.trust .num{font:800 30px/1 var(--f-num);color:var(--plum);min-width:58px;font-variant-numeric:tabular-nums;transition:color .3s}
body.dark .trust .num{color:#F0DEFF;text-shadow:0 0 18px rgba(196,0,255,.55)}
.trust .num.down{color:var(--loss)!important;text-shadow:0 0 18px rgba(255,107,139,.6)!important}
.trust .num.up{color:var(--gain)!important;text-shadow:0 0 18px rgba(151,189,243,.7)!important}
.bar{height:6px;border-radius:9px;background:rgba(101,81,111,.12);overflow:hidden;margin-top:6px}
body.dark .bar{background:rgba(255,255,255,.1)}
.bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--lav1),var(--lav2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
body.dark .bar i{background:linear-gradient(90deg,var(--violet),var(--sky))}
.clock{width:58px;height:58px;position:relative;flex:none}
.clock svg{width:58px;height:58px;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:5}
.clock .bg{stroke:rgba(101,81,111,.15)}
body.dark .clock .bg{stroke:rgba(255,255,255,.12)}
.clock .fg{stroke:var(--violet);stroke-linecap:round;transition:stroke .3s}
.clock.warn .fg{stroke:var(--loss)}
.clock span{position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--f-num);font-variant-numeric:tabular-nums}
.clock.warn span{color:var(--loss)}
.clock.idle{opacity:.35}
.moveinfo{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
body.dark .moveinfo{color:rgba(244,236,250,.55)}

h1{font:500 40px/1.05 var(--f-head);color:var(--plum);letter-spacing:-.01em}
h2{font:500 30px/1.12 var(--f-head);color:var(--plum)}
body.dark h1,body.dark h2{color:#F4ECFA}
.lead{font-size:16px;line-height:1.55;color:#4A4452;margin-top:14px}
.small{font-size:12.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-size:12px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--plum)}
.chip b{font-family:var(--f-num)}

.coverhud{display:flex;gap:10px;margin:26px 0 8px}
.mini{flex:1;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.mini .n{font:800 26px/1 var(--f-num);color:var(--plum)}
.mini .t{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.mini.clk .n{color:var(--violet)}

.egor{display:flex;gap:12px;align-items:center;margin-top:22px;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,241,200,.7),rgba(255,228,215,.7));border:1px solid rgba(229,204,190,.7)}
.ph{width:56px;height:56px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--lav1),var(--lav2));display:grid;place-items:center;font:600 18px var(--f-head);color:var(--plum);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.egor p{font:500 17px/1.3 var(--f-head);color:var(--plum)}
.egor small{display:block;font:400 12px var(--f-body);color:var(--muted);margin-top:4px}

.btn{display:block;width:100%;margin-top:22px;padding:17px 20px;border:0;border-radius:16px;cursor:pointer;font:600 16px var(--f-body);color:#fff;
  background:linear-gradient(100deg,var(--violet),var(--violet2));box-shadow:0 10px 30px rgba(155,44,255,.3);transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--plum);border:1px solid var(--line);box-shadow:none}
body.dark .btn.ghost{color:#F4ECFA;border-color:var(--nightline)}
.btn[disabled]{opacity:.45;pointer-events:none}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{text-align:left;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.8);font:400 15px/1.4 var(--f-body);color:var(--ink);cursor:pointer;transition:border-color .2s,transform .15s,background .2s;opacity:0;transform:translateY(8px);animation:in .35s forwards}
.opt:hover{border-color:var(--lav1)}
.opt:active{transform:scale(.99)}
.opt .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
body.dark .opt{background:rgba(255,255,255,.06);border-color:var(--nightline);color:#F4ECFA}
body.dark .opt:hover{border-color:rgba(196,0,255,.6);background:rgba(155,44,255,.12)}
.opt.sel{border-color:var(--violet);background:rgba(155,44,255,.1)}
.opt.preset{border-color:var(--violet)}
.opt.dim{opacity:.35!important}
@keyframes in{to{opacity:1;transform:none}}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}.opt:nth-child(5){animation-delay:.32s}

.scene{margin-top:8px;min-height:120px;font:400 17px/1.6 var(--f-body);color:#F4ECFA;white-space:pre-line;cursor:pointer}
.scene .hl{color:#F0DEFF;font-weight:500}
.caret::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--violet2);margin-left:1px}
@keyframes blink{50%{opacity:0}}
.hint{font-size:11px;color:rgba(244,236,250,.4);margin-top:8px}
.cons{margin-top:16px;padding:14px 16px;border-radius:14px;border-left:3px solid var(--loss);background:rgba(255,107,139,.08);font:400 15px/1.55 var(--f-body);color:#F4ECFA;white-space:pre-line}
.cons.gain{border-left-color:var(--gain);background:rgba(151,189,243,.1)}
.delta{font:800 15px var(--f-num);margin-right:6px}
.delta.m{color:var(--loss)}.delta.p{color:var(--gain)}

.lost{margin-top:auto;padding-top:22px;display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(244,236,250,.6)}
.stack{position:relative;width:34px;height:26px}
.stack i{position:absolute;width:26px;height:20px;border-radius:5px;border:1px solid rgba(255,107,139,.6);background:#2A1F33;left:0;top:4px}
.stack i:nth-child(2){left:4px;top:2px}.stack i:nth-child(3){left:8px;top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:20;max-width:92%;
  padding:12px 16px;border-radius:14px;background:#2A1F33;border:1px solid rgba(255,107,139,.5);color:#F4ECFA;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.4);transition:all .4s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--loss);font-weight:600}

.final .big{font:800 88px/1 var(--f-num);background:linear-gradient(100deg,#F0DEFF,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:18px;font-variant-numeric:tabular-nums}
.final .of{font-size:13px;color:rgba(244,236,250,.6);margin-top:4px}
.outcome{display:inline-block;margin-top:18px;font:600 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:99px;border:1px solid var(--nightline);color:#F0DEFF}
.cards{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.card{padding:12px 14px;border-radius:12px;background:rgba(255,107,139,.08);border:1px solid rgba(255,107,139,.35);font-size:14px;color:#F4ECFA;opacity:0;transform:translateY(10px) rotate(-1deg);transition:all .5s}
.card.on{opacity:1;transform:none}
.card small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--loss);margin-bottom:3px}
.quote{margin-top:22px;padding:16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--nightline);display:flex;gap:12px}
.quote p{font:500 18px/1.35 var(--f-head);color:#F4ECFA}
.quote small{display:block;font:400 12px var(--f-body);color:rgba(244,236,250,.55);margin-top:8px}

.prog{display:flex;gap:6px;margin:14px 0 4px}
.prog i{flex:1;height:4px;border-radius:9px;background:rgba(101,81,111,.15)}
.prog i.on{background:linear-gradient(90deg,var(--violet),var(--violet2))}

.res .type{display:inline-block;margin-top:14px;font:600 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:99px;background:linear-gradient(100deg,var(--lav1),var(--lav2));color:var(--plum)}
.block{margin-top:14px;padding:16px;border-radius:var(--r);background:rgba(255,255,255,.75);border:1px solid var(--line)}
.block h3{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.block p{font-size:15px;line-height:1.55;color:#3E3946}
.block.good{background:linear-gradient(135deg,rgba(205,219,250,.6),rgba(227,197,249,.5))}
.block.warm{background:linear-gradient(135deg,rgba(255,241,200,.75),rgba(255,228,215,.75));border-color:rgba(229,204,190,.7)}
.webinar{margin-top:22px;padding:20px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px rgba(101,81,111,.12)}
.webinar .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);font-weight:600}
.webinar h2{margin-top:8px;font-size:27px}
.webinar ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.webinar li{position:relative;padding-left:22px;font-size:14.5px;line-height:1.5;color:#3E3946}
.webinar li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--sky))}
.gifts{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--vanilla);font-size:13.5px;line-height:1.5;color:#5A4B3B}
.slots{display:grid;gap:10px;margin-top:16px}
.slot{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:500 15px var(--f-body);color:var(--ink)}
.slot small{font-weight:400;color:var(--muted);font-size:12px}
.slot.sel{border-color:var(--violet);background:rgba(155,44,255,.06)}
.slot .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.slot.sel .dot{border:5px solid var(--violet)}
.msgr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.msgr a,.msgr button{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 10px;border-radius:14px;text-decoration:none;font:600 15px var(--f-body);color:#fff;border:0;cursor:pointer}
.tg{background:#2AABEE}.mx{background:linear-gradient(135deg,#4B8BFF,#8E4BFF)}
.mail{grid-column:1/-1;background:transparent!important;color:var(--plum)!important;border:1px solid var(--line)!important;font-weight:500!important}
.disc{font-size:11px;color:var(--muted);line-height:1.5;margin-top:22px;text-align:center}
.fade{animation:sc .5s ease}
@keyframes sc{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (min-width:600px){h1{font-size:46px}.wrap{padding-top:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>

const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function orderFor(key, n){ if(!S.order[key]){ S.order[key] = shuffle([...Array(n).keys()]); save(); } return S.order[key]; }

/* ===================== ЗВУК ===================== */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur, type="sine", vol=.08, when=0){
  if(!S.sound || !ac()) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.value = freq; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+dur);
}

const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
function track(ev, extra){ if(!CONFIG.trackUrl) return; try{ fetch(CONFIG.trackUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({ev, seg:S.seg, t:Date.now()}, extra||{})),keepalive:true}).catch(()=>{}); }catch(e){} }
function toast(html){ const t = document.getElementById("toast"); t.innerHTML = html; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"), 2600); }
function flash(kind){ document.body.classList.remove("flash-loss","flash-gain"); void document.body.offsetWidth; document.body.classList.add(kind==="loss"?"flash-loss":"flash-gain"); setTimeout(()=>document.body.classList.remove("flash-loss","flash-gain"), 750); }
function setDark(on){ document.body.classList.toggle("dark", !!on); }
function setPulse(on){ document.body.classList.toggle("pulse", !!on); }

function typeText(el, text, cb){
  let i = 0, done = false;
  el.classList.add("caret");
  const finish = () => { if(done) return; done = true; el.textContent = text; el.classList.remove("caret"); el.onclick = null; cb && cb(); };
  el.onclick = finish;
  const step = () => { if(done) return; i += 2; el.textContent = text.slice(0, i); if(i >= text.length) finish(); else later(step, 22); };
  step();
}
function animateNum(el, from, to, ms=900){
  const start = performance.now(); el.classList.remove("up","down"); if(to<from) el.classList.add("down"); if(to>from) el.classList.add("up");
  const f = now => { const p = Math.min(1,(now-start)/ms), v = Math.round(from + (to-from)*(1-Math.pow(1-p,3))); el.textContent = v; if(p<1) requestAnimationFrame(f); else setTimeout(()=>el.classList.remove("up","down"), 600); };
  requestAnimationFrame(f);
}
const topbar = (dark) => `<div class="top"><div class="brand"><img src="${SPIRAL}" alt="">Школа Егора Надымова</div><div class="sp"></div><button class="snd" id="snd">${S.sound?"Звук: вкл":"Звук: выкл"}</button></div>`;
function bindSound(){ const b = document.getElementById("snd"); if(!b) return; b.onclick = () => { S.sound = !S.sound; save(); if(S.sound) ac() && AC.resume && AC.resume(); b.textContent = S.sound?"Звук: вкл":"Звук: выкл"; }; }
const egorPh = () => CONFIG.egorPhoto ? `<div class="ph"><img src="${esc(CONFIG.egorPhoto)}" alt="Егор Надымов"></div>` : `<div class="ph">ЕН</div>`;

/* ===================== ЭКРАНЫ ===================== */
function render(){
  clearTimers(); setPulse(false);
  const st = S.step;
  if(st==="cover") return cover();
  if(st==="seg") return segScreen();
  if(st.startsWith("pre")) return question(PRE, +st.slice(3), "pre");
  if(st==="ready") return ready();
  if(st==="intro") return intro();
  if(st==="move") return move();
  if(st==="outro") return outro();
  if(st==="final") return finalScreen();
  if(st.startsWith("post")) return question(POST, +st.slice(4), "post");
  if(st==="result") return result();
  if(st==="done") return done();
}
function go(step){ S.step = step; save(); render(); }

function cover(){
  setDark(false);
  H(`${topbar()}
  <div class="coverhud">
    <div class="mini"><div class="n">100</div><div class="t">очков доверия</div></div>
    <div class="mini clk"><div class="n">0:20</div><div class="t">на каждый ход</div></div>
    <div class="mini"><div class="n">4</div><div class="t">хода</div></div>
  </div>
  <h1>Тело сделало ход.<br>Теперь ваш</h1>
  <p class="lead">Одна сессия, четыре хода. На каждый — 20 секунд. У вас 100 очков доверия, и каждое решение чего-то стоит. Посмотрим, сколько останется у вас — и что на самом деле мешает вам помогать другим людям снимать зажимы и блоки.</p>
  <div class="chips"><span class="chip"><b>5</b> минут</span><span class="chip">назад нельзя</span><span class="chip">лучше со звуком</span></div>
  <div class="egor">${egorPh()}<div><p>«Я семь лет проигрывал эту партию на одном и том же ходе. Посмотрим, где ваш».</p><small>Егор Надымов, автор метода «ВитаВолна»</small></div></div>
  <button class="btn" id="go">Начать партию</button>
  <p class="disc">Это игра-симуляция, не медицинская диагностика. Прогресс сохраняется в этом браузере.</p>`);
  bindSound();
  document.getElementById("go").onclick = () => { track("start"); go("seg"); };
}

function segScreen(){
  setDark(false);
  H(`${topbar()}
  <p class="moveinfo">Подготовка к партии</p>
  <h2>За каким столом вы играете?</h2>
  <p class="lead">От этого зависит, кто окажется перед вами.</p>
  <div class="opts">${SEGS.map(s=>`<button class="opt${S.seg===s.id?" preset":""}" data-id="${s.id}">${esc(s.t)}<span class="sub">${esc(s.s)}</span></button>`).join("")}</div>`);
  bindSound();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.seg = b.dataset.id; track("seg",{v:S.seg}); go("pre0"); });
}

function question(list, i, kind){
  setDark(kind==="post");
  const Q = list[i], ord = orderFor(kind+i, Q.a.length), total = list.length;
  const label = kind==="pre" ? `Подготовка к партии · ${i+1} из ${total}` : `Разбор партии · ${i+1} из ${total}`;
  H(`${topbar()}
  <div class="prog">${list.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
  <p class="moveinfo">${label}</p>
  <h2>${esc(Q.q)}</h2>
  <div class="opts">${ord.map(k=>`<button class="opt" data-k="${k}">${esc(Q.a[k][0])}</button>`).join("")}</div>`);
  bindSound();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, v = Q.a[k][1];
    b.classList.add("sel");
    if(kind==="pre") S.pre[i] = v; else { S.post[i] = v; if(Q.key==="obj") S.obj = v; if(Q.key==="goal") S.goal = v; }
    save();
    setTimeout(() => {
      if(kind==="pre") go(i+1<total ? "pre"+(i+1) : "ready");
      else go(i+1<total ? "post"+(i+1) : "result");
    }, 220);
  });
}

function ready(){
  setDark(true);
  H(`${topbar()}
  <p class="moveinfo">Фигуры расставлены</p>
  <h2>Дальше часы идут по-настоящему</h2>
  <p class="lead" style="color:rgba(244,236,250,.8)">20 секунд на ход. Не успели — тело почувствует вашу растерянность. Как и на настоящей сессии.<br><br>Свет приглушён. Перед вами человек.</p>
  <button class="btn" id="go">Первый ход</button>`);
  bindSound();
  document.getElementById("go").onclick = () => { ac(); S.move = 0; S.phase="play"; S.trust = 100; S.cards = []; S.log = []; track("game_start"); go("intro"); };
}

function hud(showClock){
  return `<div class="hud">
    <div class="trust"><div style="flex:1"><div class="lbl">Доверие тела</div><div class="bar"><i id="bar" style="width:${Math.max(0,S.trust)}%"></i></div></div><div class="num" id="num">${S.trust}</div></div>
    ${showClock?`<div class="clock idle" id="clock"><svg viewBox="0 0 58 58"><circle class="bg" cx="29" cy="29" r="25"/><circle class="fg" id="arc" cx="29" cy="29" r="25" stroke-dasharray="157" stroke-dashoffset="0"/></svg><span id="sec">20</span></div>`:""}
  </div>`;
}
const lostRow = () => `<div class="lost"><div class="stack">${S.cards.slice(-3).map(()=>"<i></i>").join("")}</div>Потеряно: <b style="color:var(--loss)">${S.cards.length}</b></div>`;

function intro(){
  setDark(true);
  const sc = SCENES[S.seg];
  H(`${topbar()}${hud(false)}
  <p class="moveinfo">Сцена · ${esc(sc.name)}</p>
  <div class="scene" id="txt"></div>
  <p class="hint" id="hint">Нажмите на текст, чтобы не ждать печати</p>
  <div id="after"></div>
  ${lostRow()}`);
  bindSound();
  typeText(document.getElementById("txt"), sc.intro, () => {
    document.getElementById("hint").style.display = "none";
    document.getElementById("after").innerHTML = `<button class="btn" id="go">Сесть рядом</button>`;
    document.getElementById("go").onclick = () => go("move");
  });
}

function move(){
  setDark(true);
  const sc = SCENES[S.seg], M = sc.moves[S.move], ord = orderFor("m"+S.seg+S.move, M.o.length);
  H(`${topbar()}${hud(true)}
  <p class="moveinfo">Ход ${S.move+1} из 4${M.climax?" · кульминация":""}</p>
  <div class="scene" id="txt"></div>
  <p class="hint" id="hint">Нажмите на текст, чтобы не ждать печати</p>
  <div class="opts" id="opts"></div>
  <div id="after"></div>
  ${lostRow()}`);
  bindSound();
  if(M.climax){ setPulse(true); beat(); const hb = setInterval(beat, 1100); timers.push(hb); }
  typeText(document.getElementById("txt"), M.q, () => {
    document.getElementById("hint").style.display = "none";
    const box = document.getElementById("opts");
    box.innerHTML = ord.map(k=>`<button class="opt" data-k="${k}">${esc(M.o[k].t)}</button>`).join("");
    let left = 20, answered = false;
    const clock = document.getElementById("clock"), arc = document.getElementById("arc"), sec = document.getElementById("sec");
    clock.classList.remove("idle");
    const iv = setInterval(() => {
      left--; sec.textContent = Math.max(0,left); arc.style.strokeDashoffset = String(157*(1-left/20));
      if(left<=5){ clock.classList.add("warn"); tick(); }
      if(left<=0){ clearInterval(iv); if(!answered){ answered = true; resolve(null); } }
    }, 1000); timers.push(iv);
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => { if(answered) return; answered = true; clearInterval(iv); b.classList.add("sel"); box.querySelectorAll(".opt").forEach(x=>{ if(x!==b) x.classList.add("dim"); }); resolve(M.o[+b.dataset.k]); });
  });

  function resolve(opt){
    const o = opt || TIMEOUT, from = S.trust;
    S.trust = Math.max(0, Math.min(100, S.trust + o.d));
    if(o.c) S.cards.push(o.c);
    S.log.push({m:S.move, d:o.d, t:opt?opt.t:"timeout"});
    save();
    if(!opt) document.getElementById("opts").querySelectorAll(".opt").forEach(x=>x.classList.add("dim"));
    animateNum(document.getElementById("num"), from, S.trust);
    document.getElementById("bar").style.width = S.trust + "%";
    if(o.d < 0){ flash("loss"); lossSnd(); } else { flash("gain"); gainSnd(); }
    const box = document.getElementById("after");
    box.innerHTML = `<div class="cons${o.d>0?" gain":""}" id="cons"><span class="delta ${o.d<0?"m":"p"}">${o.d>0?"+":""}${o.d}</span><span id="ctext"></span></div>`;
    typeText(document.getElementById("ctext"), o.r, () => {
      if(o.c) toast(`В копилку потерь: <b>«${esc(o.c)}»</b>`);
      const last = S.move >= 3;
      box.insertAdjacentHTML("beforeend", `<button class="btn" id="next">${last?"Чем всё закончилось":"Следующий ход"}</button>`);
      document.getElementById("next").onclick = () => { if(last) go("outro"); else { S.move++; save(); go("move"); } };
    });
  }
}

function outro(){
  setDark(true);
  const sc = SCENES[S.seg];
  H(`${topbar()}${hud(false)}
  <p class="moveinfo">После сессии</p>
  <div class="scene" id="txt"></div>
  <div id="after"></div>
  ${lostRow()}`);
  bindSound();
  typeText(document.getElementById("txt"), sc.outro, () => {
    document.getElementById("after").innerHTML = `<button class="btn" id="go">Посмотреть счёт партии</button>`;
    document.getElementById("go").onclick = () => { track("game_end",{score:S.trust}); go("final"); };
  });
}

function outcome(score){
  if(score >= 75) return {k:"Почти победа", t:"Тело вам поверило. Но честно: вы знаете почему? Завтра, с другим человеком, вы повторите эту партию?"};
  if(score >= 50) return {k:"Пат", t:"Никто не выиграл. Тело приоткрылось — и закрылось ровно в тот момент, когда вы не знали, что делать."};
  return {k:"Тело закрылось", t:"Не потому, что вы мало чувствуете. А потому, что в главный момент у вас не было хода."};
}
function finalScreen(){
  setDark(true);
  const oc = outcome(S.trust), cards = S.cards.slice(-3);
  H(`<div class="final">${topbar()}
  <p class="moveinfo">Счёт партии</p>
  <div class="big" id="big">100</div>
  <div class="of">из 100 очков доверия</div>
  <div class="outcome">${esc(oc.k)}</div>
  <p class="lead" style="color:rgba(244,236,250,.85)">${esc(oc.t)}</p>
  ${cards.length?`<div class="cards">${cards.map(c=>`<div class="card"><small>Потеряно</small>${esc(c)}</div>`).join("")}</div>`:""}
  <div class="quote">${egorPh()}<div><p>«Я семь лет проигрывал именно на третьем ходе. Однажды почувствовал волну — и годами не мог её повторить. И не знал, что делать, когда тело человека начинало отвечать. Что в итоге помогло, расскажу на эфире».</p><small>Егор Надымов</small></div></div>
  <button class="btn" id="go">Разобрать мою партию</button>
  <p class="small" style="text-align:center;margin-top:10px;color:rgba(244,236,250,.5)">Ещё 3 вопроса — и разбор</p></div>`);
  bindSound();
  animateNum(document.getElementById("big"), 100, S.trust, 1400);
  app.querySelectorAll(".card").forEach((c,i)=> later(()=>{ c.classList.add("on"); lossSnd(); }, 1500 + i*600));
  document.getElementById("go").onclick = () => go("post0");
}

function calcType(){
  const sc = {sila:0,chut:0,kont:0,serd:0,pot:0};
  S.pre.forEach(v => { if(sc[v]!==undefined) sc[v]++; });
  const p4 = S.post[0]; if(sc[p4]!==undefined) sc[p4] += 2;
  return Object.keys(sc).sort((a,b) => sc[b]-sc[a] || (b===p4) - (a===p4))[0];
}

function mskNow(){ const d = new Date(Date.now() + 3*3600e3); return {y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), wd:d.getUTCDay(), min:d.getUTCHours()*60+d.getUTCMinutes()}; }
function slotOptions(){
  const n = mskNow(), res = [], days = ["вс","пн","вт","ср","чт","пт","сб"], months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  CONFIG.slots.forEach(h => { const diff = h*60 - n.min; if(diff >= 90 && diff <= 360) res.push({id:fmt(0,h), label:`Сегодня, ${h}:00`, sub:"через "+Math.round(diff/60)+" ч"}); });
  const t = new Date(Date.UTC(n.y, n.m, n.d + 1));
  CONFIG.slots.forEach(h => res.push({id:fmt(1,h), label:`Завтра, ${h}:00`, sub:`${days[t.getUTCDay()]}, ${t.getUTCDate()} ${months[t.getUTCMonth()]}`}));
  return res;
  function fmt(add,h){ const x = new Date(Date.UTC(n.y, n.m, n.d + add)); return `${x.getUTCFullYear()}${String(x.getUTCMonth()+1).padStart(2,"0")}${String(x.getUTCDate()).padStart(2,"0")}${h}`; }
}

function result(){
  setDark(false);
  const tk = calcType(), T = TYPES[tk]; S.type = tk; save();
  const slots = slotOptions();
  if(!S.slot || !slots.find(s=>s.id===S.slot)) S.slot = (slots.find(s=>s.label.startsWith("Завтра") && s.label.endsWith("19:00"))||slots[0]).id;
  H(`<div class="res">${topbar()}
  <p class="moveinfo">Разбор партии · ${S.trust} из 100</p>
  <span class="type">Ваш тип — ${esc(T.name)} · «${esc(T.nick)}»</span>
  <h2 style="margin-top:14px">${esc(T.hit)}</h2>
  <div class="block"><h3>Где вы теряете доверие</h3><p>${esc(T.loss)}</p>${S.obj?`<p style="margin-top:10px">${esc(OBJ[S.obj])}</p>`:""}</div>
  <div class="block good"><h3>Хорошая новость</h3><p>${esc(T.good)} И чтобы начать работать с другим человеком, не нужно сначала ярко чувствовать самому.</p></div>
  ${S.goal?`<div class="block warm"><h3>Ваша цель</h3><p>Вы хотите ${esc(GOALS[S.goal])}. С этого и начнём.</p></div>`:""}

  <div class="webinar">
    <div class="k">Бесплатный эфир Егора Надымова</div>
    <h2>${esc(WEBINAR)}</h2>
    <p class="lead" style="font-size:15px">На эфире я покажу, что делать в ту самую секунду, когда тело человека начинает отвечать. И как начать через ваш вход — даже если сами вы пока чувствуете мало.</p>
    <ul>
      <li><b>Для вашего типа:</b> ${esc(T.web)}</li>
      <li>Что замечать в дыхании, движениях и ответах человека, когда собственные ощущения слабые</li>
      <li>Две практики прямо на эфире: короткая проба в середине и общая практика под моим ведением в конце</li>
    </ul>
    <div class="gifts">🎁 Участникам эфира — три медитации: «Трансформация», «Восстановление» и «Гармония в отношениях».</div>
    <p class="moveinfo" style="margin-top:20px">Выберите время</p>
    <div class="slots">${slots.map(s=>`<div class="slot${s.id===S.slot?" sel":""}" data-id="${s.id}"><div>${esc(s.label)}<br><small>${esc(s.sub)}</small></div><span class="dot"></span></div>`).join("")}</div>
    <p class="moveinfo" style="margin-top:20px">Куда прислать ссылку и напоминание</p>
    <div class="msgr">
      <a class="tg" data-m="tg" target="_blank" rel="noopener" href="#">Telegram</a>
      <a class="mx" data-m="max" target="_blank" rel="noopener" href="#">MAX</a>
      <button class="mail" data-m="mail">Только на почту</button>
    </div>
    <p class="small" style="margin-top:12px">Эфир бесплатный. Ссылка с автовходом придёт в выбранный мессенджер или на почту.</p>
  </div>
  <p class="disc">Тест-игра помогает заметить, что мешает в работе с человеком. Это не медицинская диагностика и не обещание результата.</p></div>`);
  bindSound();
  track("result",{type:tk, score:S.trust, obj:S.obj});
  app.querySelectorAll(".slot").forEach(el => el.onclick = () => { S.slot = el.dataset.id; save(); app.querySelectorAll(".slot").forEach(x=>x.classList.toggle("sel", x===el)); });
  const setLinks = () => { const a = app.querySelector('.msgr [data-m=tg]'), b = app.querySelector('.msgr [data-m=max]'); a.href = CONFIG.telegram + encodeURIComponent(payload()); b.href = CONFIG.max + encodeURIComponent(payload()); };
  setLinks();
  app.querySelectorAll(".slot").forEach(el => el.addEventListener("click", setLinks));
  app.querySelectorAll(".msgr [data-m]").forEach(b => b.onclick = () => register(b.dataset.m));
}

function payload(){ return `${S.seg}_${S.type}_${S.obj||"x"}_${S.slot}`; }
function register(m){
  const data = {email:QS.get("email")||"", name:QS.get("name")||"", seg:S.seg, type:S.type, obj:S.obj, goal:S.goal, score:S.trust, slot:S.slot, messenger:m, utm:QS.get("utm_campaign")||"", wave:QS.get("wave")||""};
  if(CONFIG.registerUrl){ try{ fetch(CONFIG.registerUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),keepalive:true}).catch(()=>{}); }catch(e){} }
  track("register",{m, slot:S.slot});
  S.msg = m; save();
  setTimeout(() => go("done"), 150);
}
function done(){
  setDark(false);
  const s = slotOptions().find(x=>x.id===S.slot);
  const where = S.msg==="mail" ? "на почту" : (S.msg==="max" ? "в MAX" : "в Telegram");
  H(`${topbar()}
  <h1 style="margin-top:30px">Вы в партии</h1>
  <p class="lead">Эфир: <b>${esc(s?s.label:"завтра")}</b>${s?` (${esc(s.sub)})`:""}. Ссылку с автовходом и напоминание пришлём ${where}.</p>
  ${S.msg!=="mail"?`<p class="lead">Если бот не открылся, нажмите ещё раз:</p><div class="msgr"><a class="${S.msg==="max"?"mx":"tg"}" target="_blank" rel="noopener" href="${(S.msg==="max"?CONFIG.max:CONFIG.telegram)+encodeURIComponent(payload())}">Открыть бота</a></div>`:""}
  <div class="egor">${egorPh()}<div><p>«До встречи на эфире. Возьмите с собой ваш счёт — ${S.trust} из 100. Посмотрим, что с ним станет».</p><small>Егор Надымов</small></div></div>
  <p class="disc">Прогресс сохранён в этом браузере.</p>`);
  bindSound();
}

document.addEventListener('pointerdown', () => { if(S.sound && ac() && AC.state === 'suspended' && AC.resume) AC.resume(); }, true);
render();
</script>
</body>
</html>
