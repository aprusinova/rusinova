<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: одна узкая колонка-«карточка теста» по центру, силуэт тела как сквозной образ. Единый светлый вид бренда. */
:root{
  --cream:#F8F5EF;        /* фон страницы, как в айдентике */
  --white:#FFFFFF;
  --offwhite:#F1F1F1;
  --lav-1:#E3C5F9; --lav-2:#CDDBFA;   /* Lavender Wave */
  --vanilla:#FFF1C8;
  --peach:#E5CCBE;
  --pink:#FFE4D7;
  --sky:#97BDF3;
  --ink:#2C2D34;          /* основной текст: графит, темнее Concrete для читаемости */
  --ink-2:#5E6068;
  --line:#E2DEE6;
  --violet:#8B5CC8;       /* глубокий оттенок волны для акцентов и кнопок */
  --violet-d:#6E43AC;
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mark:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  background-image:radial-gradient(60rem 40rem at 110% -10%,rgba(205,219,250,.55),transparent 60%),radial-gradient(50rem 36rem at -20% 110%,rgba(255,228,215,.7),transparent 60%);background-attachment:fixed;min-height:100%}
.wrap{max-width:680px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding-block:20px 18px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--f-mark);font-size:19px;letter-spacing:.04em;color:var(--ink)}
.logo{width:34px;height:34px;flex:none}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;color:var(--ink)}
.eyebrow{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--violet)}
.btn{appearance:none;border:0;cursor:pointer;font:600 17px/1.2 var(--f-display);padding:18px 28px;border-radius:999px;
  background:linear-gradient(100deg,var(--violet) 0%,#7C7FD8 100%);color:#fff;box-shadow:0 10px 24px -10px rgba(110,67,172,.55);transition:transform .15s ease,box-shadow .15s ease;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(110,67,172,.6)}
.btn:focus-visible,.opt:focus-visible,.ghost:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.ghost{appearance:none;background:none;border:0;cursor:pointer;font:500 15px var(--f-body);color:var(--ink-2);padding:8px 4px;display:inline-flex;gap:6px;align-items:center}
.ghost:hover{color:var(--ink)}
.screen{padding-top:28px}

/* ---- старт ---- */
.hero{display:grid;grid-template-columns:1fr 210px;gap:28px;align-items:end}
.hero h1{font-size:clamp(32px,6.4vw,46px);font-weight:800;line-height:1.08;letter-spacing:-.01em}
.hero .sub{font:600 clamp(18px,3vw,21px)/1.35 var(--f-display);color:var(--violet-d);margin:14px 0 0}
.portrait{position:relative;border-radius:var(--r) var(--r) 0 0;overflow:hidden;background:linear-gradient(160deg,var(--lav-1),var(--lav-2) 70%);aspect-ratio:516/700;max-width:100%}
.portrait img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;display:block}
.cap{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.4}
.lead{margin:26px 0 0;display:grid;gap:12px;max-width:62ch}
.lead p{margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 28px;padding:0;list-style:none}
.facts li{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink-2)}
.start-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.small{font-size:14px;color:var(--ink-2)}
.messages{margin-top:40px;display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;background:var(--white);border-radius:var(--r);padding:24px}
.messages ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.messages li{display:grid;gap:0}
.messages b{font-family:var(--f-display);font-size:15px}
.messages span{font-size:14px;color:var(--ink-2)}

/* ---- вопросы ---- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;min-height:40px}
.count{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--offwhite);overflow:hidden;margin-bottom:30px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav-1),var(--sky));border-radius:99px;transition:width .35s ease}
.qtitle{font-size:clamp(23px,4.6vw,30px);font-weight:700;line-height:1.2;margin-bottom:24px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;cursor:pointer;width:100%;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;font:400 17px/1.4 var(--f-body);color:var(--ink);transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--lav-1);background:#FCFAFF}
.opt.sel{border-color:var(--violet);background:linear-gradient(100deg,rgba(227,197,249,.35),rgba(205,219,250,.35))}
.opt:active{transform:scale(.995)}
.hint{font-size:14px;color:var(--ink-2);margin:-12px 0 20px}

/* ---- результат ---- */
.r-top{display:grid;grid-template-columns:1fr 170px;gap:24px;align-items:center}
.r-says{font-size:15px;color:var(--ink-2);margin:0 0 6px}
.r-quote{font:800 clamp(28px,5.6vw,40px)/1.12 var(--f-display);margin:0 0 14px;color:var(--ink)}
.r-type{display:inline-flex;gap:8px;align-items:center;background:var(--vanilla);border-radius:999px;padding:6px 14px;font:600 14px var(--f-display)}
.r-zone{margin:12px 0 0;font-size:15px;color:var(--ink-2)}
.r-zone b{color:var(--ink);font-weight:600}
.figure{max-width:170px;width:100%}
.block{margin-top:30px;display:grid;gap:12px;max-width:64ch}
.block h3{font-size:20px;font-weight:700}
.block p{margin:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.pair section{background:var(--white);border-radius:16px;padding:20px;display:grid;gap:8px;align-content:start}
.pair section h3{font-size:17px;font-weight:700}
.pair section p{margin:0;font-size:16px}
.pair .plus{box-shadow:inset 0 0 0 1.5px var(--vanilla)}
.second{margin-top:20px;padding:14px 18px;border-radius:14px;background:rgba(255,228,215,.6);font-size:16px}
.cta{margin-top:34px;border-radius:24px;padding:28px 24px;background:linear-gradient(140deg,var(--lav-1) 0%,var(--lav-2) 60%,#DCE8FB 100%);display:grid;gap:14px}
.cta h2{font-size:clamp(22px,4.4vw,28px);font-weight:800;line-height:1.2}
.cta p{margin:0;max-width:56ch}
.msgr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.msgr a{background:var(--white);color:var(--ink);border-radius:16px;padding:16px;text-decoration:none;display:flex;align-items:center;gap:12px;font:700 17px var(--f-display);box-shadow:0 6px 18px -10px rgba(60,40,110,.35);transition:transform .15s}
.msgr a:hover{transform:translateY(-2px)}
.msgr a small{display:block;font:400 13px var(--f-body);color:var(--ink-2)}
.msgr svg{width:34px;height:34px;flex:none}
.tools{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;align-items:center}
.disc{margin-top:26px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px}

/* силуэт */
.body-fill{fill:#EFE7F7}
.limb{stroke:#EFE7F7;stroke-linecap:round;fill:none}
.zone{fill:url(#zg);opacity:.95;transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
.zone.z2{fill:url(#zg2);animation-delay:1.2s;opacity:.8}
.zone.teaser{fill:var(--violet);opacity:.55;animation:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.12);opacity:.7}}
@media (prefers-reduced-motion:reduce){.zone{animation:none}.bar i,.btn,.opt,.msgr a{transition:none}}

@media (max-width:560px){
  body{font-size:16px}
  .hero{grid-template-columns:1fr 120px;gap:16px;align-items:start}
  .messages{grid-template-columns:1fr;justify-items:center;text-align:center}
  .messages svg{max-width:120px}
  .r-top{grid-template-columns:1fr 104px;gap:14px;align-items:start}
  .pair,.msgr{grid-template-columns:1fr}
  .btn{width:100%}
}
</style>

</head>

<script>
/* =========================================================
   НАСТРОЙКИ — меняются здесь
   ========================================================= */
const CONFIG = {

  telegram: "https://t.me/ИМЯ_БОТА?start=",      // TODO: вставить имя бота в Telegram

/* Пол: тексты пишутся как {женская|мужская} форма */
let SEX = "f";
const g = s => s.replace(/\{([^|}]*)\|([^}]*)\}/g, (_, f, m) => SEX === "m" ? m : f);

/* ---------- типы ---------- */
const TYPES = {

      "Тело запоминает это буквально. Ответственность садится на плечи. Шея каменеет, холка растёт, к вечеру тяжелеет голова. Вы можете не замечать этого годами, потому что привыкли терпеть.",

    what: [

  serdce: {

const ORDER = ["opora","dozor","serdce","golos","zemlya"];

/* ---------- вопросы: [текст, тип] ---------- */
const QUESTIONS = [
  {q:"Вечер после тяжёлого дня. Что вы делаете чаще всего?", a:[
    ["Доделываю дела за всех: кто, если не я","opora"],

        <p class="cap">Егор Надымов, автор метода «Витаволна»</p>
      </div>
    </div>
    <div class="lead">
      <p>Тело всегда говорит первым. Мы обычно слышим его, только когда оно начинает кричать: болью в спине, бессонницей, усталостью, которую не снимает даже отпуск.</p>
      <p>Ответьте на 12 вопросов о знакомых ситуациях. Вы узнаете, какое послание держит ваше тело, где оно сидит и куда утекает ваша энергия.</p>
    </div>
    <ul class="facts"><li>Без регистрации</li><li>Результат сразу</li><li>Практика для вашей зоны в подарок</li></ul>
    <div class="start-row">
      <button class="btn" id="go">${inProgress ? "Продолжить тест" : "Пройти тест"}</button>
      ${inProgress ? '<button class="ghost" id="reset">Начать заново</button>' : ''}
    </div>
    <div class="messages">
      ${figure(null,null,true)}
      <ul>
        ${ORDER.map(k=>`<li><b>«${esc(TYPES[k].msg.replace(/\{([^|}]*)\|[^}]*\}/g,"$1"))}»</b><span>${TYPES[k].zone}</span></li>`).join("")}
      </ul>
    </div>
  </section>`;
  document.getElementById("go").onclick = () => {
    if(inProgress){ S.step="q"; save(); render(); return; }
    track("start"); go("sex");
  };
  const r = document.getElementById("reset"); if(r) r.onclick = restart;
}

function sexScreen(){
  app.innerHTML = `
  <section class="screen">
    <div class="qhead"><button class="ghost" id="back">← Назад</button><span class="count">Перед началом</span></div>
    <div class="bar"><i style="width:4%"></i></div>
    <h2 class="qtitle">Укажите ваш пол</h2>
    <p class="hint">Так формулировки в вопросах и результате будут про вас.</p>
    <div class="opts">
      <button class="opt" data-v="f">Женский</button>
      <button class="opt" data-v="m">Мужской</button>
    </div>
  </section>`;
  document.getElementById("back").onclick = () => go("start");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.sex = b.dataset.v; S.i = 0; S.answers = []; go("q"); });
}

function questionScreen(){
  const i = S.i, Q = QUESTIONS[i];
  const pct = Math.round(((i)/(QUESTIONS.length+1))*100)+4;
  app.innerHTML = `
  <section class="screen">
    <div class="qhead"><button class="ghost" id="back">← Назад</button><span class="count">Вопрос ${i+1} из ${QUESTIONS.length}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <h2 class="qtitle">${esc(g(Q.q))}</h2>
    <div class="opts">
      ${S.order[i].map(k => `<button class="opt${S.answers[i]===k?' sel':''}" data-k="${k}">${esc(g(Q.a[k][0]))}</button>`).join("")}
    </div>
  </section>`;
  document.getElementById("back").onclick = () => { if(i===0) go("sex"); else { S.i--; save(); render(); } };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    b.classList.add("sel");
    S.answers[i] = +b.dataset.k;
    track("q"+(i+1));
    setTimeout(() => { if(i < QUESTIONS.length-1){ S.i++; save(); render(); window.scrollTo({top:0}); } else go("goal"); }, 220);
  });
}

function goalScreen(){
  app.innerHTML = `
  <section class="screen">
    <div class="qhead"><button class="ghost" id="back">← Назад</button><span class="count">Последний вопрос</span></div>
    <div class="bar"><i style="width:96%"></i></div>
    <h2 class="qtitle">Чего вам хочется больше всего прямо сейчас?</h2>
    <div class="opts">${GOALS.map((t,k)=>`<button class="opt${S.goal===k?' sel':''}" data-k="${k}">${esc(t)}</button>`).join("")}</div>
  </section>`;
  document.getElementById("back").onclick = () => { S.i = QUESTIONS.length-1; go("q"); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => { b.classList.add("sel"); S.goal = +b.dataset.k; setTimeout(()=>go("result"),220); });
}

/* ---------- подсчёт ---------- */
function score(){
  const pts = Object.fromEntries(ORDER.map(k=>[k,0]));
  S.answers.forEach((k,i) => { if(k!=null) pts[QUESTIONS[i].a[k][1]] += 2; });
  const tiebreak = S.answers[1]!=null ? QUESTIONS[1].a[S.answers[1]][1] : null;   // вопрос 2 — телесный отклик
  const sorted = ORDER.slice().sort((a,b) => (pts[b]-pts[a]) || ((b===tiebreak)-(a===tiebreak)));
  const main = sorted[0], sec = sorted[1];
  const second = pts[sec] >= pts[main]*0.6 && pts[sec]>0 ? sec : null;
  return {main, second, pts};
}

function resultScreen(){
  const {main, second, pts} = score();
  const T = TYPES[main];
  if(!S.sent){ S.sent = true; save(); sendResult({type:main, second, pts, sex:S.sex, goal:GOALS[S.goal]??null, answers:S.answers}); }
  const goalLine = S.goal!=null ? `<p>Вы написали, что больше всего хотите: <b>${esc(GOALS[S.goal].toLowerCase())}</b>. Практика — первый шаг к этому.</p>` : "";
  app.innerHTML = `
  <section class="screen">
    <p class="eyebrow">Ваш результат</p>
    <div class="r-top">
      <div>
        <p class="r-says">Ваше тело говорит:</p>
        <h1 class="r-quote">«${esc(g(T.msg))}»</h1>
        <span class="r-type">Тип: ${esc(T.name)}</span>
        <p class="r-zone">Где сидит блок: <b>${T.zone}</b></p>
      </div>
      ${figure(main, second)}
    </div>

    <div class="block">
      <h3>Что с вами происходит</h3>
      ${T.what.map(p=>`<p>${esc(g(p))}</p>`).join("")}
    </div>

    <div class="pair">
      <section class="plus"><h3>Ваша сила</h3><p>${esc(g(T.strength))}</p></section>
      <section><h3>Почему не помогает просто отдохнуть</h3><p>${esc(g(T.blocks))}</p></section>
    </div>

    ${second ? `<p class="second">Ещё ваше тело держит напряжение в зоне <b>${TYPES[second].zone}</b>: «${esc(g(TYPES[second].msg))}».</p>` : ""}

    <div class="block"><h3>С чего начать</h3><p>${esc(g(T.step))}</p></div>

    <div class="cta" id="cta">
      <h2>Заберите практику для проработки блока в ${T.zoneShort}</h2>
      <p>Короткая аудиопрактика от Егора, подобранная под ваш тип. Включаете, ложитесь или садитесь удобно, и тело начинает отпускать.</p>
      ${goalLine}
      <p><b>Выберите, где вам удобнее её получить:</b></p>
      <div class="msgr">
        <a href="${CONFIG.telegram}${main}" target="_blank" rel="noopener" data-m="telegram">
          <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#2AABEE"/><path d="M11 23.5l22-8.5c1-.4 1.9.2 1.6 1.7l-3.7 17.6c-.3 1.3-1 1.6-2.1 1l-5.8-4.3-2.8 2.7c-.3.3-.6.6-1.2.6l.4-5.9 10.8-9.8c.5-.4-.1-.6-.7-.2l-13.4 8.4-5.7-1.8c-1.2-.4-1.3-1.2.6-1.5z" fill="#fff"/></svg>
          <span>Telegram<small>Откроется бот</small></span>
        </a>
        <a href="${CONFIG.max}${main}" target="_blank" rel="noopener" data-m="max">
          <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="mx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B8BFF"/><stop offset="1" stop-color="#8E4BFF"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#mx)"/><text x="24" y="30" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="800" font-size="14" fill="#fff">MAX</text></svg>
          <span>MAX<small>Откроется бот</small></span>
        </a>
      </div>
      <p class="small">Практика бесплатная. В боте Егор расскажет, как работать с вашим блоком дальше.</p>
    </div>

    <div class="tools">
      <button class="ghost" id="share">Скопировать ссылку на тест</button>
      <button class="ghost" id="again">Пройти заново</button>
    </div>
    <p class="disc">Тест помогает заметить, где тело держит напряжение. Это не медицинская диагностика. Если у вас боль или другие симптомы, обратитесь к врачу.</p>
  </section>`;
  app.querySelectorAll(".msgr a").forEach(a => a.addEventListener("click", () => track("cta_"+a.dataset.m)));
  document.getElementById("again").onclick = restart;
  document.getElementById("share").onclick = async () => {
    const url = location.href.split("#")[0];
    try{ await navigator.clipboard.writeText(url); toast("Ссылка скопирована"); }
    catch(e){ toast(url); }
  };
}

function restart(){
  S = { step:"start", sex:null, i:0, answers:[], goal:null, order:QUESTIONS.map(q=>shuffle(q.a.map((_,k)=>k))), sent:false };
  save(); render();
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

/* ---------- сбор статистики (подключим на шаге 4) ---------- */
function track(event){
  if(!CONFIG.saveUrl) return;
  try{ fetch(CONFIG.saveUrl, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({event, t:Date.now()}), keepalive:true}).catch(()=>{}); }catch(e){}
}
function sendResult(data){
  if(!CONFIG.saveUrl) return;
  try{ fetch(CONFIG.saveUrl, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({event:"result", ...data, t:Date.now()}), keepalive:true}).catch(()=>{}); }catch(e){}
}

render();
</script>
